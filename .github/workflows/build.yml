name: Build unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Read build number
        id: ver
        run: |
          BUILD=$(grep -m1 'CURRENT_PROJECT_VERSION' project.yml | sed -E 's/[^0-9]//g')
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "Build $BUILD"

      - name: Self-check (receipt reader, categories)
        run: |
          swiftc -O Sources/Core/*.swift Tools/SelfCheck/main.swift -o /tmp/selfcheck 2>&1 | tee /tmp/sc.log
          grep -E "error:" /tmp/sc.log | head -n 30 | sed 's/^/::error::/' || true
          /tmp/selfcheck | tee /tmp/sc_out.log
          grep "^FAIL" /tmp/sc_out.log | sed 's/^/::error::/' || true
          grep -q "ALL PASSED" /tmp/sc_out.log

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project Seringgit.xcodeproj \
            -scheme Seringgit \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > /tmp/build.log 2>&1 || true
          grep -E "error:|BUILD (SUCCEEDED|FAILED)" /tmp/build.log | head -n 80
          grep -E "error:" /tmp/build.log | sort -u | head -n 40 | sed -E 's#^/Users/runner/work/[^/]+/[^/]+/##' | sed 's/^/::error::/' || true
          test -d build/Build/Products/Release-iphoneos/Seringgit.app

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Seringgit.app Payload/
          zip -qry "Seringgit_build${{ steps.ver.outputs.build }}.ipa" Payload
          ls -lh *.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Seringgit_build${{ steps.ver.outputs.build }}
          path: Seringgit_build${{ steps.ver.outputs.build }}.ipa

      - name: Publish release with the IPA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ steps.ver.outputs.build }}"
          gh release delete "$TAG" -y --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" "Seringgit_build${{ steps.ver.outputs.build }}.ipa" \
            --title "Seringgit build ${{ steps.ver.outputs.build }}" \
            --notes "Unsigned IPA for sideloading (AltStore / Sideloadly)."
